name: Publish
# Runs on a version tag (e.g. 0.1.1). PyPI and npm use Trusted Publishing (OIDC):
# no tokens are stored. Configure once:
#   PyPI: https://pypi.org/manage/account/publishing/  project onekey-sdk, owner panp1,
#         repository onekey-sdk, workflow publish.yml, environment pypi
#   npm:  package settings -> Trusted publisher -> GitHub, panp1/onekey-sdk, publish.yml
on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which registries to publish (both, pypi, npm)"
        default: both
jobs:
  pypi:
    if: ${{ github.event_name == 'push' || inputs.target != 'npm' }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=src python -m unittest discover -s tests
        working-directory: python
      - run: pip install build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
  npm:
    if: ${{ github.event_name == 'push' || inputs.target != 'pypi' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # No registry-url: it would write an _authToken placeholder to .npmrc and
      # npm would use that instead of the OIDC identity (trusted publishing).
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@latest
      - run: node --test
        working-directory: node
      # OIDC needs npm >= 11.5 and the id-token permission; print both facts
      # so a failed exchange is diagnosable without secrets in the log.
      - run: npm -v && test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo "id-token available"
      - run: npm publish --access public
        working-directory: node
